services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # No login is required by the local API; binding all interfaces would expose saved scenes.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      DATA_DIR: /app/data
      FRONTEND_DIST: /app/frontend/dist
      TIMEZONE: ${TIMEZONE:-Asia/Tokyo}
      FOTMOB_TIMEOUT: ${FOTMOB_TIMEOUT:-10}
    volumes:
      # A named volume survives restarts without platform-specific host paths or permissions.
      - studio-data:/app/data
    restart: unless-stopped
    init: true
    # Inherit the Dockerfile healthcheck so docker run and Compose use one definition.

volumes:
  studio-data:
