services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    environment:
      DATA_DIR: /app/data
      FRONTEND_DIST: /app/frontend/dist
      TIMEZONE: ${TIMEZONE:-Asia/Tokyo}
      FOTMOB_TIMEOUT: ${FOTMOB_TIMEOUT:-10}
    volumes:
      - studio-data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  studio-data:
