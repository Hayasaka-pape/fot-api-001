name: Build and verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build and start production container
        # Rebuild from source instead of reusing host dist: verify what the launch scripts ship.
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Check demo, saved overlay, exports and web routes
        # Live upstream availability is outside this release; deterministic demo checks avoid that coupling.
        run: python scripts/smoke.py --base-url http://127.0.0.1:8000
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color studio
      - name: Stop containers
        if: always()
        run: docker compose down
